stages:
  - test
  - build

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python -m compileall bot/          # синтакс-проверка всех модулей
    - python -m bot --help 2>/dev/null || true

docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - docker build -t event-helper-bot:$CI_COMMIT_TAG .
    - docker save event-helper-bot:$CI_COMMIT_TAG -o event-helper-bot-$CI_COMMIT_TAG.tar
  artifacts:
    paths:
      - event-helper-bot-*.tar
    expire_in: 1 week
